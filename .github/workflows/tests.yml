name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Fetch the robot models (MuJoCo Menagerie, pinned commit, only the two models used)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/google-deepmind/mujoco_menagerie third_party/menagerie
          git -C third_party/menagerie sparse-checkout set universal_robots_ur5e robotiq_2f85
          git -C third_party/menagerie checkout cda5236f98383f6fbaa4820c6b18dba892cd087f

      - name: Install dependencies (and OSMesa, a software OpenGL renderer for the camera tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
          REQUIRE_GL: "1"  # camera tests must run here, not skip
        run: pytest -q
